<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Учёт времени по задаче</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="eyebrow" id="asOf">Учёт времени по задаче</div>
        <div class="task-id" id="taskId">Задача</div>
        <h1 class="task-title" id="taskTitle">Загружаем…</h1>
      </header>

      <section class="summary" id="summary" aria-label="Сводка времени">
        <div class="summary__main">
          <span>Всего времени</span>
          <strong id="totalValue">—</strong>
          <small>Время, указанное в задаче на момент открытия приложения</small>
        </div>
        <div class="summary__details">
          <span class="summary__details-title">Хештеги задачи</span>
          <dl>
            <div><dt>ЭЛРОС</dt><dd id="elrosValue">—</dd></div>
            <div><dt>Обучение</dt><dd id="trainingValue">—</dd></div>
          </dl>
          <details class="summary__vrb">
            <summary><span>ВРБ</span><strong id="vrbTotalValue">—</strong></summary>
            <dl>
              <div><dt>ВРБ</dt><dd id="vrbValue">—</dd></div>
              <div><dt>ВРБ15</dt><dd id="vrb15Value">—</dd></div>
              <div><dt>ВРБ2</dt><dd id="vrb2Value">—</dd></div>
            </dl>
          </details>
        </div>
        <div class="summary__clean">
          <span>Чистое время</span>
          <strong id="cleanValue">—</strong>
          <small>Без учёта Элрос и Обучения, с учётом коэффициентов ВРБ15 и ВРБ2</small>
        </div>
      </section>

      <section class="panel" aria-labelledby="employeesTitle">
        <div class="panel__head">
          <h2 id="employeesTitle">Расшифровка времени</h2>
          <span class="panel__meta" id="meta">загружаем…</span>
        </div>
        <div class="state" id="state" hidden></div>
        <div id="departments" class="departments"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
