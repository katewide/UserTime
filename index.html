<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Учёт времени по задачам</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <main class="shell">
      <header class="masthead">
        <div class="masthead__kicker">Учёт времени · карточка задачи</div>
        <div class="masthead__row">
          <h1 class="masthead__title" id="taskTitle">Задача</h1>
          <div class="masthead__total">
            <span class="masthead__total-label">Учтено времени</span>
            <span class="masthead__total-value" id="totalValue">—</span>
          </div>
        </div>
        <p class="masthead__note" id="note">
          Сколько времени каждый сотрудник учёл по этой задаче — на текущий момент.
        </p>
      </header>

      <section class="panel">
        <div class="panel__head">
          <h2 class="panel__title">Сотрудники</h2>
          <span class="panel__meta" id="meta">загружаем…</span>
        </div>

        <div class="state" id="state" hidden></div>

        <ol class="leaderboard" id="leaderboard"></ol>
      </section>
    </main>

    <!-- The Bitrix24 frame SDK provides TASK_VIEW_TAB placement options,
         including the ID of the task currently open in the portal. -->
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <script src="/app.js"></script>
  </body>
</html>
